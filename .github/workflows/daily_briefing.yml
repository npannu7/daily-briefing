name: Daily STEM Briefing

on:
  schedule:
    # GitHub cron is in UTC. India = UTC + 5:30.
    - cron: '30 2 * * *'    # 08:00 IST  morning edition
    - cron: '30 3 * * *'    # 09:00 IST  morning backup (skips if already made)
    - cron: '30 10 * * *'   # 16:00 IST  evening edition
    - cron: '30 11 * * *'   # 17:00 IST  evening backup (skips if already made)
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to make'
        type: choice
        options: [auto, morning, evening]
        default: auto
      force:
        description: 'Re-make it even if this edition already exists today'
        type: boolean
        default: false

permissions:
  contents: write          # commit podcast.xml + upload audio to the release

concurrency:
  group: daily-briefing    # never let two runs push at the same time
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -U -r requirements.txt

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EDITION: ${{ inputs.edition || 'auto' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python generate_briefing.py

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch audio        # old storage folder, no longer used
          git add -A podcast.xml episodes.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Briefing update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin main
