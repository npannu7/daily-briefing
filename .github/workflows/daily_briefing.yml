name: Weights and Measures

on:
  schedule:
    # GitHub cron is in UTC. India = UTC + 5:30.
    - cron: '30 2 * * *'    # 08:00 IST  morning edition
    - cron: '30 3 * * *'    # 09:00 IST  morning backup (skips if already made)
    - cron: '30 10 * * *'   # 16:00 IST  evening edition
    - cron: '30 11 * * *'   # 17:00 IST  evening backup (skips if already made)
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to make'
        type: choice
        options: [auto, morning, evening]
        default: auto
      force:
        description: 'Re-make it even if this edition already exists today'
        type: boolean
        default: false
      tts:
        description: 'Voice engine'
        type: choice
        options: [auto, gemini, fish, edge]
        default: auto
      deep_dive:
        description: 'Make this a deep dive on the most built-up topic'
        type: boolean
        default: false

permissions:
  contents: write      # commit feed, quiz and cover; upload audio
  issues: write        # read and close feedback sent from quiz.html

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U -r requirements.txt

      - name: Draw cover art (first run only)
        run: |
          if [ ! -f artwork.jpg ]; then
            pip install -q matplotlib numpy
            python make_cover.py
          fi

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WRITER_MODELS: ${{ vars.WRITER_MODELS }}
          HELPER_MODELS: ${{ vars.HELPER_MODELS }}
          DECISION_MODELS: ${{ vars.DECISION_MODELS }}
          OPENROUTER_DAILY_USD: ${{ vars.OPENROUTER_DAILY_USD }}
          FISH_VOICE_A: ${{ vars.FISH_VOICE_A }}
          FISH_VOICE_B: ${{ vars.FISH_VOICE_B }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EDITION: ${{ inputs.edition || 'auto' }}
          FORCE: ${{ inputs.force || 'false' }}
          TTS_ENGINE: ${{ inputs.tts || 'auto' }}
          DEEP_DIVE: ${{ inputs.deep_dive || 'false' }}
        run: python generate_briefing.py

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch audio
          git add -A podcast.xml episodes.json quiz.json transcripts artwork.jpg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Briefing update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin main
