<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weights &amp; Measures · Play</title>
<link rel="icon" href="artwork.jpg">
<style>
:root{
  --bg:#F6F4EE; --card:#FFFFFF; --ink:#141A2B; --muted:#5E6A82; --line:#E3E0D7;
  --accent:#A86400; --accent-ink:#FFFFFF; --soft:#FFF1D6; --good:#17794F; --good-soft:#E3F4EC;
  --bad:#B93A34; --bad-soft:#FBE9E7; --chip:#EFEDE6; --blue:#2A63C4; --shadow:0 6px 24px rgba(20,26,43,.10);
}
[data-theme="exchange"]{--accent:#0B7D62; --soft:#DDF4EC}
[data-theme="bench"]{--accent:#2A63C4; --soft:#E2ECFB}
[data-theme="case"]{--accent:#7D3FB5; --soft:#F0E6FA}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A0F1E; --card:#121A2E; --ink:#F1EEE6; --muted:#9AA8C4; --line:#24304A;
    --accent:#FFB547; --accent-ink:#0A0F1E; --soft:#2A2312; --good:#4CC38A; --good-soft:#0F2A1F;
    --bad:#FF7A70; --bad-soft:#2E1414; --chip:#1B2540; --blue:#7FB0FF; --shadow:0 6px 24px rgba(0,0,0,.45);
  }
  [data-theme="exchange"]{--accent:#4CD4A8; --soft:#10291F}
  [data-theme="bench"]{--accent:#7FB0FF; --soft:#14213D}
  [data-theme="case"]{--accent:#C8A2FF; --soft:#241A38}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 72px}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;
  font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:48px;
  transition:transform .08s ease, opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px;min-height:38px}
.btn.wide{width:100%}
.link{background:none;border:0;padding:8px 0;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:underline}

/* ---------- home ---------- */
.top{display:flex;gap:12px;align-items:center;margin:2px 0 14px}
.top img{width:44px;height:44px;border-radius:10px;flex:none}
.top h1{font-size:17px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{margin:1px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1;min-width:0}
.pills{display:flex;gap:6px;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:5px 10px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.cold{color:var(--muted);font-weight:600}
.status{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.status span{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--muted)}
.status .ok{background:var(--good-soft);color:var(--good);font-weight:600}
.status .late{background:var(--bad-soft);color:var(--bad);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.hero{position:relative;overflow:hidden;border:0;box-shadow:var(--shadow);padding:18px}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--accent)}
.hero .kick{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin:2px 0 6px}
.hero h2{font-size:22px;line-height:1.2;margin:0 0 4px}
.hero .ep{color:var(--muted);font-size:13px;margin:0 0 10px}
.hero .brief{font-size:15px;margin:0 0 14px}
.hero .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .meta{color:var(--muted);font-size:13px}
.meter{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:12px 0 0}
.meter span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.eprow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin:0 0 8px;cursor:pointer}
.eprow .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--soft);display:flex;align-items:center;
  justify-content:center;font-size:18px}
.eprow .t{display:block;font-weight:600;font-size:15px;line-height:1.3}
.eprow .s{display:block;color:var(--muted);font-size:13px}
.eprow .grow{flex:1;min-width:0}
.eprow .pts{flex:none;font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.eprow .pts.done{color:var(--good)}
.heard{border-left:4px solid var(--good)}
.heard .pair{margin:0 0 8px;font-size:14px}
.heard .pair:last-child{margin:0}
.heard .said{color:var(--muted)}
.heard .did{display:block;font-weight:600}
.nudge{border-left:4px solid var(--accent);font-size:14px}
.calib{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.calib .bar{position:relative;height:10px;background:var(--chip);border-radius:5px}
.calib .bar i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:5px}
.calib .bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.calib .n{color:var(--muted);font-variant-numeric:tabular-nums}
.week{display:flex;gap:6px;margin:10px 0 0}
.week div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.week i{display:block;height:28px;border-radius:8px;background:var(--chip);margin-bottom:3px}
.week i.on{background:var(--accent)}
.word{border-top:1px solid var(--line);padding:8px 0}
.word:first-child{border-top:0;padding-top:0}
.word b{font-size:15px}
.word p{margin:1px 0 0;font-size:14px;color:var(--muted)}
details.fold summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";color:var(--muted);font-weight:400}
details.fold[open] summary::after{content:"–"}
details.fold > div{margin-top:12px}
input[type=password],input[type=text].tok{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:transparent;color:var(--ink);margin:8px 0}

/* ---------- stage (the game) ---------- */
.stage{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column}
.stage[hidden]{display:none}
.stage-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);font-size:18px;cursor:pointer;line-height:1}
.prog{flex:1;display:flex;gap:3px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--chip);transition:background .2s}
.prog i.done{background:var(--accent)} .prog i.now{background:var(--accent);opacity:.45}
.score{flex:none;min-width:56px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;position:relative}
.pop{position:absolute;right:100%;top:0;margin-right:8px;font-weight:800;white-space:nowrap;animation:pop .9s ease-out forwards;pointer-events:none}
.pop.plus{color:var(--good)} .pop.minus{color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.stage-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 20px}
.stage-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;
  border-top:1px solid var(--line);background:var(--bg)}
.stage-foot .btn{flex:1}
.back{flex:none;width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-size:18px;cursor:pointer}
.back:disabled{opacity:.3}
.cardc{max-width:560px;margin:0 auto;animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:800;color:var(--accent);background:var(--soft);border-radius:999px;padding:4px 10px;margin:8px 0 12px}
.q{font-size:21px;line-height:1.3;font-weight:700;margin:0 0 16px}
.q.big{font-size:24px}
.q.long{font-size:17px;font-weight:600;line-height:1.4}
.sub{color:var(--muted);font-size:14px;margin:-8px 0 14px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);
  border-radius:14px;padding:13px 14px;margin:0 0 10px;cursor:pointer;font-size:16px;line-height:1.35;min-height:52px;
  transition:transform .08s ease,border-color .15s,background .15s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt:disabled{cursor:default}
.opt .mk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--chip);display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .mk{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.8} .opt.wrong .mk{background:var(--bad);color:#fff}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.dim{opacity:.55}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.say{min-height:22px;font-size:15px;margin:10px 0 0}
.say.good{color:var(--good);font-weight:700} .say.bad{color:var(--bad);font-weight:700}
.say .why{display:block;color:var(--ink);font-weight:400;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:18px 10px;font-size:18px;font-weight:800;
  cursor:pointer;min-height:64px;transition:transform .08s ease,border-color .15s,background .15s}
.tf:active:not(:disabled){transform:scale(.97)}
.tf.sel{border-color:var(--accent);background:var(--soft)}
.tf.right{border-color:var(--good);background:var(--good-soft)} .tf.wrong{border-color:var(--bad);background:var(--bad-soft)}
.conf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.conf button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px;cursor:pointer;text-align:center}
.conf button b{display:block;font-size:17px} .conf button span{display:block;font-size:11px;color:var(--muted)}
.conf button.sel{border-color:var(--accent);background:var(--soft)}
.stake{text-align:center;font-size:14px;color:var(--muted);margin:8px 0 0;min-height:21px}
.stake b.plus{color:var(--good)} .stake b.minus{color:var(--bad)}
.stamp{display:inline-block;border:3px solid currentColor;border-radius:10px;padding:2px 12px;font-weight:900;font-size:26px;
  letter-spacing:.06em;transform:rotate(-4deg);margin:2px 0 12px;animation:stamp .35s ease-out}
.stamp.t{color:var(--good)} .stamp.f{color:var(--bad)}
@keyframes stamp{from{opacity:0;transform:rotate(-4deg) scale(1.8)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
.claim{font-size:17px;color:var(--muted);margin:0 0 8px}
.result{border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.result.win{background:var(--good-soft)} .result.lose{background:var(--bad-soft)} .result.flat{background:var(--chip)}
.result b{font-size:17px}
.takeaway{border-left:4px solid var(--accent);padding:4px 0 4px 12px;margin:12px 0;font-size:16px;font-weight:600}
.react{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 0}
.react button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;cursor:pointer;font-size:14px;font-weight:600}
.react button span{display:block;font-size:22px;line-height:1.2}
.react button.sel{border-color:var(--accent);background:var(--soft)}
.est-val{text-align:center;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 0}
.est-val small{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px}
.est-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.est-track{position:relative;height:44px;margin:8px 0 0}
.est-track .line{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--chip)}
.est-track .mark{position:absolute;top:8px;width:4px;height:30px;border-radius:2px;margin-left:-2px}
.est-track .mark.you{background:var(--ink)} .est-track .mark.true{background:var(--good)}
.est-track .lab{position:absolute;top:-10px;font-size:11px;font-weight:700;transform:translateX(-50%);white-space:nowrap}
.est-track .lab.you{color:var(--ink)} .est-track .lab.true{color:var(--good);top:38px}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duel button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px 10px;cursor:pointer;min-height:120px;
  display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center;font-size:16px;font-weight:600;line-height:1.3}
.duel button .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.duel button .v small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.duel button.right{border-color:var(--good);background:var(--good-soft)} .duel button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.clue{background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:16px}
.clue.new{animation:enter .25s ease-out}
.clue b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block}
.worth{font-size:13px;color:var(--muted);margin:2px 0 10px}
.mcols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px}
.mcols button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px;cursor:pointer;font-size:14px;line-height:1.3;
  min-height:56px;text-align:left;width:100%;margin:0 0 8px}
.mcols .l button{font-weight:700}
.mcols button.sel{border-color:var(--accent);background:var(--soft)}
.mcols button.right{border-color:var(--good);background:var(--good-soft);cursor:default}
.olist{list-style:none;margin:0 0 10px;padding:0}
.olist li{display:flex;gap:10px;align-items:center;margin:0 0 8px}
.olist .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--muted);font-size:13px;
  font-weight:800;display:flex;align-items:center;justify-content:center}
.olist .slot{flex:1;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:46px;font-size:15px;
  text-align:left;background:transparent;cursor:pointer}
.olist .slot.filled{border-style:solid;border-color:var(--muted);background:var(--card)}
.olist .slot.right{border-color:var(--good);background:var(--good-soft)}
.pool{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.pool button{border:2px solid var(--line);background:var(--chip);border-radius:12px;padding:10px 12px;font-size:15px;text-align:left;cursor:pointer}
.timer{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:0 0 14px}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.qf-count{color:var(--muted);font-size:13px;margin:0 0 6px;font-weight:700}
.qf-list{list-style:none;margin:0;padding:0}
.qf-list li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.qf-list li:first-child{border-top:0}
.qf-list .m{flex:none;font-weight:800;width:20px} .qf-list .m.ok{color:var(--good)} .qf-list .m.no{color:var(--bad)}
.qf-list small{display:block;color:var(--muted)}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15px;margin:0 0 6px}
.note b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.center{text-align:center}
.bigicon{font-size:54px;line-height:1.1;margin:16px 0 6px}
.total{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;margin:8px 0 2px}
.total small{font-size:16px;font-weight:700;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums} .stat span{font-size:12px;color:var(--muted)}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.stars button{border:0;background:none;font-size:34px;line-height:1;cursor:pointer;color:var(--line);padding:2px;transition:transform .08s}
.stars button.on{color:var(--accent)} .stars button:active{transform:scale(1.2)}
.fb{text-align:left}
.frow{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.frow > span{flex:none;width:56px;font-size:13px;color:var(--muted)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea{width:100%;min-height:72px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;
  background:transparent;color:var(--ink)}
.sent{font-size:14px;margin:8px 0 0;min-height:21px}
.sent.ok{color:var(--good);font-weight:600} .sent.err{color:var(--bad)}
.wchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.wchips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.wmean{font-size:14px;color:var(--muted);min-height:21px;margin:4px 0 0}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

/* ---------- hands-on labs (sliders, readouts, charts): unchanged from the first puzzle page ---------- */
.step-text{font-size:17px;line-height:1.45;margin:0 0 14px}
.example{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;margin:0 0 6px}
.example b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.slider{margin:0 0 12px}
.slider .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.slider .top b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:2px 0 0}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0 12px}
.ro{background:var(--chip);border-radius:12px;padding:8px 10px}
.ro .l{font-size:12px;color:var(--muted);line-height:1.3}
.ro .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.ro .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.robar{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.robar span{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .15s}
.ro.k1 .robar span{background:var(--blue)} .ro.k2 .robar span{background:var(--good)} .ro.k3 .robar span{background:var(--muted)}
.ro .l i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.chart{margin:0 0 12px}
.chart svg{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:10px}
.chart .curve{fill:none;stroke-width:2.5;stroke-linejoin:round}

<body>
<div class="wrap">
  <header class="top">
    <img src="artwork.jpg" alt="">
    <div class="grow"><h1 id="show">Weights &amp; Measures</h1><p id="sub">Three-minute games on each episode</p></div>
    <div class="pills" id="pills"></div>
  </header>
  <div id="list"><p class="empty">Loading episodes…</p></div>
</div>
<div class="stage" id="stage" hidden role="dialog" aria-modal="true" aria-label="Episode game">
  <div class="stage-top">
    <button class="x" id="x" type="button" aria-label="Close the game">✕</button>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <div class="score" id="score" aria-label="Points">0</div>
  </div>
  <div class="stage-body" id="stage-body"></div>
  <div class="stage-foot">
    <button class="back" id="back" type="button" aria-label="Back">←</button>
    <button class="btn" id="next" type="button">Continue</button>
  </div>
</div>
<script>
(function(){
  /* Weights & Measures - the play page.
     quiz.json is written by generate_briefing.py. Each episode has a "play" object: a session theme, and for each
     segment a bet and two or three cards. The card formats (ROUNDS in generate_briefing.py) each have one renderer
     here, with the same name. Episodes made before 13 Nov 2026 have "lessons" instead; legacyPlay() turns those
     into cards. Nothing here is written by a model: models only supply the data. */
  var store = {
    get: function(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  var DATA = null, state = {};
  var SVGNS = 'http://www.w3.org/2000/svg';
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    for (var k in (attrs||{})) {
      if (attrs[k] === undefined || attrs[k] === null || attrs[k] === false) continue;
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'on') for (var ev in attrs.on) n.addEventListener(ev, attrs.on[ev]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(function(c){ if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function svg(tag, attrs){
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) { if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
    return n;
  }
  function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

  /* ---------- formulas: the same small language the generator checks (generate_briefing.py) ---------- */
  var FUNCS = {min:Math.min, max:Math.max, abs:Math.abs, sqrt:Math.sqrt, exp:Math.exp, ln:Math.log,
    log10:function(x){ return Math.log(x) / Math.LN10; }, pow:Math.pow, round:Math.round, floor:Math.floor,
    ceil:Math.ceil, sin:Math.sin, cos:Math.cos, tan:Math.tan, ncdf:ncdf};
  function ncdf(x){   // same approximation as generate_briefing.py (Abramowitz & Stegun 7.1.26)
    var z = Math.abs(x) / Math.SQRT2, t = 1 / (1 + 0.3275911 * z);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z);
    return 0.5 * (1 + (x >= 0 ? y : -y));
  }
  var CONSTS = {pi:Math.PI, e:Math.E};
  var CACHE = {};
  function parseExpr(src){
    if (CACHE[src]) return CACHE[src];
    var re = /\s*(?:(\d+\.?\d*(?:[eE][-+]?\d+)?|\.\d+(?:[eE][-+]?\d+)?)|([A-Za-z_]\w*)|(\S))/g, toks = [], m;
    re.lastIndex = 0;
    while (re.lastIndex < src.length && (m = re.exec(src)) && m[0].length) {
      if (m[1] !== undefined) toks.push(['num', parseFloat(m[1])]);
      else if (m[2] !== undefined) toks.push(['id', m[2]]);
      else if (m[3] !== undefined) { if ('+-*/^(),'.indexOf(m[3]) < 0) throw new Error('bad char'); toks.push(['op', m[3]]); }
    }
    var i = 0;
    function is(v){ return i < toks.length && toks[i][0] === 'op' && toks[i][1] === v; }
    function expr(){ var n = term(); while (is('+') || is('-')) { var op = toks[i++][1]; n = ['bin', op, n, term()]; } return n; }
    function term(){ var n = unary(); while (is('*') || is('/')) { var op = toks[i++][1]; n = ['bin', op, n, unary()]; } return n; }
    function unary(){
      if (is('-')) { i++; return ['neg', unary()]; }
      if (is('+')) { i++; return unary(); }
      var n = atom(); if (is('^')) { i++; n = ['bin', '^', n, unary()]; } return n;
    }
    function atom(){
      var t = toks[i];
      if (!t) throw new Error('incomplete');
      if (t[0] === 'num') { i++; return ['num', t[1]]; }
      if (t[0] === 'id') {
        i++;
        if (is('(')) {
          if (!FUNCS[t[1]]) throw new Error('unknown function');
          i++; var args = [expr()]; while (is(',')) { i++; args.push(expr()); }
          if (!is(')')) throw new Error('expected )'); i++;
          return ['call', t[1], args];
        }
        return CONSTS.hasOwnProperty(t[1]) ? ['num', CONSTS[t[1]]] : ['var', t[1]];
      }
      if (is('(')) { i++; var n = expr(); if (!is(')')) throw new Error('expected )'); i++; return n; }
      throw new Error('unexpected');
    }
    var tree = expr();
    if (i !== toks.length) throw new Error('trailing');
    return (CACHE[src] = tree);
  }
  function evalTree(t, env){
    switch (t[0]) {
      case 'num': return t[1];
      case 'var': return env.hasOwnProperty(t[1]) ? env[t[1]] : NaN;
      case 'neg': return -evalTree(t[1], env);
      case 'call': return FUNCS[t[1]].apply(null, t[2].map(function(a){ return evalTree(a, env); }));
    }
    var a = evalTree(t[2], env), b = evalTree(t[3], env);
    return t[1] === '+' ? a + b : t[1] === '-' ? a - b : t[1] === '*' ? a * b : t[1] === '/' ? a / b : Math.pow(a, b);
  }
  function compute(step, values){
    var env = {};
    step.inputs.forEach(function(inp){ env[inp.id] = values[inp.id]; });
    step.outputs.forEach(function(o){
      var v; try { v = evalTree(parseExpr(o.expr), env); } catch(e){ v = NaN; }
      env[o.id] = isFinite(v) ? v : NaN;
    });
    return env;
  }
  function decimals(x){ var s = String(x); return s.indexOf('.') < 0 ? 0 : Math.min(4, s.length - s.indexOf('.') - 1); }
  function fmt(v, digits){
    if (!isFinite(v)) return '—';
    var a = Math.abs(v), d = digits !== undefined ? digits : a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : a === 0 ? 0 : 3;
    return v.toLocaleString('en', {minimumFractionDigits: d, maximumFractionDigits: d});
  }
  function hashStr(s){ var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function shuffled(items, seed){
    var idx = items.map(function(_, i){ return i; }), h = hashStr(seed);
    for (var i = idx.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0; var j = h % (i + 1); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    if (idx.every(function(v, i){ return v === i; })) idx.push(idx.shift());
    return idx;
  }

  /* ---------- template pictures: one per puzzle template (generate_briefing.py TEMPLATES) ----------
     Shapes and short numbers are drawn in SVG; every label that comes from the lesson (names of stages, groups,
     people, objects) is ordinary page text beside the picture, so long labels wrap instead of colliding. */
  function rnd(a, b){ var h = hashStr(a + ':' + b); return (h % 100000) / 100000; }
  function gauss(a, b){ var u = Math.max(1e-6, rnd(a, b)), v = rnd(b, a + 7); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function txt(s, x, y, t, cls, anchor){ s.appendChild(svg('text', {x:x, y:y, class: cls || 'vt', 'text-anchor': anchor || 'start', text: t})); }
  function outOf(step, id){ return step.outputs.filter(function(o){ return o.id === id; })[0] || {lo:0, hi:1}; }
  function inOf(step, id){ return step.inputs.filter(function(i){ return i.id === id; })[0]; }
  function frame(h){ return svg('svg', {viewBox:'0 0 320 ' + h, class:'view-svg', role:'img'}); }
  // The picture plus its words: title above, columns (aligned with the drawing's sections), legend and captions below.
  function pic(svgEl, o){
    o = o || {};
    var w = el('div', {class:'pic'});
    if (o.title) w.appendChild(el('div', {class:'pic-title', text: o.title}));
    if (o.top) w.appendChild(cols(o.top));
    if (svgEl) w.appendChild(svgEl);
    if (o.cols) w.appendChild(cols(o.cols));
    if (o.legend) {
      var lg = el('div', {class:'pic-legend'});
      o.legend.forEach(function(it){ lg.appendChild(el('span', {}, [el('i', {class:'sw ' + it[0]}), it[1]])); });
      w.appendChild(lg);
    }
    (o.cap || []).forEach(function(c){ if (c) w.appendChild(el('div', {class:'pic-cap ' + (c.cls || ''), text: c.t || c})); });
    return w;
  }
  function cols(list){
    var r = el('div', {class:'pic-cols', style:'grid-template-columns:repeat(' + list.length + ',minmax(0,1fr))'});
    list.forEach(function(c){ r.appendChild(el('div', {class:'pic-col ' + (c.cls || '')}, [el('div', {class:'name', text: c.name}),
      c.sub !== undefined ? el('div', {class:'sub', text: c.sub}) : null])); });
    return r;
  }

  var VIEWS = {
    tank: function(box, step, v){
      return function(env){
        var x = env[v.value], L = env[v.target], span = (v.hi - v.lo) || 1, s = frame(150);
        var f = clamp((x - v.lo) / span, 0, 1), tl = clamp((L - v.lo) / span, 0, 1);
        s.appendChild(svg('rect', {x:20, y:10, width:86, height:130, rx:10, class:'v-vessel'}));
        s.appendChild(svg('rect', {x:22, y:12 + 126 * (1 - f), width:82, height:126 * f, rx:8, class:'v-fill'}));
        s.appendChild(svg('line', {x1:14, x2:112, y1:12 + 126 * (1 - tl), y2:12 + 126 * (1 - tl), class:'v-target'}));
        var way = L !== v.start ? clamp((x - v.start) / (L - v.start), 0, 1) : 1;
        txt(s, 128, 52, fmt(x) + ' ' + (v.unit || ''), 'vt big');
        txt(s, 128, 82, 'heading for ' + fmt(L) + ' ' + (v.unit || ''), 'vt muted');
        txt(s, 128, 108, Math.round(way * 100) + '% of the way there', 'vt');
        return pic(s, {title: v.label, legend: [['sw-acc', v.label], ['sw-line-bad', 'the level it heads for']]});
      };
    },
    blocks: function(box, step, v){
      return function(env){
        var fold = env[v.fold], s = frame(160), grow = v.mode === 'grow', lit = grow ? Math.min(128, Math.round(fold)) : Math.round(128 * clamp(fold, 0, 1));
        for (var i = 0; i < 128; i++) s.appendChild(svg('rect', {x: 8 + (i % 16) * 19, y: 6 + Math.floor(i / 16) * 19, width:16, height:16, rx:3,
          class: i < lit ? 'v-on' : 'v-off'}));
        return pic(s, {cap: [{t: grow ? (fold > 128 ? '×' + fmt(fold) + ' the start (more than the grid holds)' : '×' + fmt(fold) + ' the start')
          : fmt(fold * 100) + '% left', cls: 'big'}]});
      };
    },
    runs: function(box, step, v){
      return function(env, values){
        var p = values[v.p] / 100, n = Math.round(values[v.n]), R = 12, s = frame(R * 16 + 6), done = 0;
        var w = Math.min(16, 270 / n);
        for (var r = 0; r < R; r++) {
          var failed = false;
          for (var c = 0; c < n; c++) {
            var cls = 'v-off';                       // after a failure the run stops
            if (!failed) { if (rnd('run' + r, c) < p) cls = 'v-good'; else { cls = 'v-bad'; failed = true; } }
            s.appendChild(svg('rect', {x: 4 + c * w, y: 4 + r * 16, width: Math.max(1, w - 1.5), height:12, rx:2, class: cls}));
          }
          if (!failed) done++;
          txt(s, 288, 14 + r * 16, failed ? '✗' : '✓', failed ? 'vt bad' : 'vt good');
        }
        return pic(s, {legend: [['sw-good', v.step + ' worked'], ['sw-bad', 'first failure']],
          cap: [done + ' of ' + R + ' ' + v.run + 's finished all ' + n + ' ' + v.step + 's']});
      };
    },
    dots: function(box, step, v){
      var s = frame(196), cells = [], wrap = null, cap = null;
      for (var i = 0; i < 1000; i++) { var c = svg('circle', {cx: 6 + (i % 40) * 7.8, cy: 6 + Math.floor(i / 40) * 7.8, r:3}); cells.push(c); s.appendChild(c); }
      return function(env, values){
        var real = Math.round(values[v.prev] * 10), tp = Math.min(real, Math.round(env[v.tp])), fp = Math.round(env[v.fp]);
        cells.forEach(function(c, i){ c.setAttribute('class', i < tp ? 'v-tp' : i < real ? 'v-fn' : i < real + fp ? 'v-fp' : 'v-tn'); });
        if (!wrap) {
          wrap = pic(s, {legend: [['sw-acc', 'real, ' + v.flagged], ['sw-hollow', 'real, missed'], ['sw-bad', v.flagged + ' by mistake'], ['sw-off', 'the rest']],
            cap: [' ']});
          cap = wrap.querySelector('.pic-cap');
        }
        cap.textContent = 'Out of 1000 ' + v.who + ': ' + tp + ' real cases ' + v.flagged + ', ' + (real - tp) + ' missed, ' + fp + ' ' + v.flagged + ' by mistake.';
        return wrap;
      };
    },
    bells: function(box, step, v){
      return function(env, values){
        var s = frame(150), th = values[v.th], L = 10, W = 300, H = 120;
        function X(x){ return L + (x - v.lo) / (v.hi - v.lo) * W; }
        function Y(y){ return 10 + H * (1 - y); }
        function curve(m, from, to){
          var pts = [], N = 60;
          for (var j = 0; j <= N; j++) { var x = from + (to - from) * j / N; pts.push(X(x).toFixed(1) + ',' + Y(Math.exp(-(x - m) * (x - m) / (2 * v.sd * v.sd)) * 0.95).toFixed(1)); }
          return pts;
        }
        var thc = clamp(th, v.lo, v.hi);
        s.appendChild(svg('polygon', {points: [X(v.lo) + ',' + Y(0)].concat(curve(v.pos, v.lo, thc), [X(thc) + ',' + Y(0)]).join(' '), class:'v-shade-bad'}));
        s.appendChild(svg('polygon', {points: [X(thc) + ',' + Y(0)].concat(curve(v.neg, thc, v.hi), [X(v.hi) + ',' + Y(0)]).join(' '), class:'v-shade-acc'}));
        s.appendChild(svg('polyline', {points: curve(v.neg, v.lo, v.hi).join(' '), class:'v-line blue'}));
        s.appendChild(svg('polyline', {points: curve(v.pos, v.lo, v.hi).join(' '), class:'v-line red'}));
        s.appendChild(svg('line', {x1:X(thc), x2:X(thc), y1:6, y2:Y(0), class:'v-cut'}));
        s.appendChild(svg('line', {x1:L, x2:L + W, y1:Y(0), y2:Y(0), class:'axis'}));
        txt(s, clamp(X(thc), 24, 296), 146, 'cut-off', 'vt muted', 'middle');   // stays inside at the extremes
        return pic(s, {legend: [['sw-blue', v.neg_label], ['sw-bad', v.pos_label], ['sw-shade', 'shaded: wrongly sorted']]});
      };
    },
    spread: function(box, step, v){
      var nIn = inOf(step, v.n), widest = 1.96 * v.sd / Math.sqrt(nIn.min) * 1.25;
      return function(env, values){
        var s = frame(122), lo = v.true - widest, hi = v.true + widest, se = v.sd / Math.sqrt(values[v.n]);
        function X(x){ return 10 + (x - lo) / (hi - lo) * 300; }
        s.appendChild(svg('rect', {x: X(env[v.lo]), y:18, width: Math.max(1, X(env[v.hi]) - X(env[v.lo])), height:84, rx:6, class:'v-band'}));

  function stepExplore(step, p, solve){
    var n = el('div', {}, [el('p', {class:'step-text', text: step.text})]);
    var values = {}, viewBox = null, drawView = null;
    if (step.view && VIEWS[step.view.kind]) {   // a template's own picture, above the sliders
      viewBox = el('div', {class:'view'});
      n.appendChild(viewBox);
      drawView = VIEWS[step.view.kind](viewBox, step, step.view);
    }
    step.inputs.forEach(function(inp){ values[inp.id] = (p.values && p.values[inp.id] !== undefined) ? p.values[inp.id] : inp.value; });
    var labels = {}, readouts = {}, goalBox = null, chartBox = null;
    step.inputs.forEach(function(inp){
      var val = el('b'), range = el('input', {type:'range', min: inp.min, max: inp.max, step: inp.step, value: values[inp.id],
        'aria-label': inp.label});
      labels[inp.id] = val;
      range.addEventListener('input', function(){ values[inp.id] = parseFloat(range.value); p.values = values; update(); });
      range.addEventListener('change', function(){ p.values = values; p.persist(); });
      n.appendChild(el('div', {class:'slider'}, [el('div', {class:'top'}, [el('span', {text: inp.label}), val]), range]));
    });
    var ro = el('div', {class:'readouts'});
    if (step.view && step.view.readouts === false) ro.style.display = 'none';
    step.outputs.forEach(function(o, k){
      var v = el('div', {class:'v'}), bar = el('span');
      readouts[o.id] = {v: v, bar: bar, o: o};
      var onChart = step.chart && step.chart.y.indexOf(o.id) >= 0;
      ro.appendChild(el('div', {class:'ro k' + (k % 4)}, [el('div', {class:'l'}, [onChart ? el('i', {style: 'background:var(' + COLOURS[k % 4] + ')'}) : null, o.label]),
        v, el('div', {class:'robar'}, [bar])]));
    });
    n.appendChild(ro);
    if (step.chart) { chartBox = el('div', {class:'chart'}); n.appendChild(chartBox); }
    if (step.goal) {
      goalBox = el('div', {class:'goal'});
      n.appendChild(goalBox);
    } else if (!p.solved) setTimeout(function(){ solve(false); }, 0);

    function inputById(id){ return step.inputs.filter(function(i){ return i.id === id; })[0]; }
    function outputById(id){ return step.outputs.filter(function(o){ return o.id === id; })[0]; }
    function update(){
      var env = compute(step, values);
      step.inputs.forEach(function(inp){ labels[inp.id].textContent = fmt(values[inp.id], decimals(inp.step)) + (inp.unit ? ' ' + inp.unit : ''); });
      step.outputs.forEach(function(o){
        var r = readouts[o.id], v = env[o.id];
        r.v.innerHTML = ''; r.v.appendChild(document.createTextNode(fmt(v, o.digits)));
        if (o.unit) r.v.appendChild(el('small', {text: o.unit}));
        var lo = Math.min(0, o.lo), hi = Math.max(0, o.hi), w = hi > lo ? (v - lo) / (hi - lo) : 0;
        r.bar.style.width = (isFinite(w) ? Math.max(0, Math.min(1, w)) * 100 : 0) + '%';
      });
      if (chartBox) drawChart(chartBox, step, values);
      if (drawView) { var picture = drawView(env, values); if (picture && picture.parentNode !== viewBox) { viewBox.innerHTML = ''; viewBox.appendChild(picture); } }
      if (goalBox) {
        var g = step.goal, tv = env[g.target];
        var met = p.solved || (isFinite(tv) && tv >= g.min - 1e-9 && tv <= g.max + 1e-9);
        goalBox.className = 'goal' + (met ? ' met' : '');
        goalBox.innerHTML = '';
        goalBox.appendChild(el('b', {text: met ? 'You found it' : 'Challenge'}));
        goalBox.appendChild(document.createTextNode(met && g.success ? g.success : g.text));
        if (met && !p.solved) solve(false);
      }
    }
    update();
    return n;
  }

  var COLOURS = ['--accent', '--blue', '--good', '--muted'];
  function drawChart(box, step, values){
    function colour(o){ return step.outputs.indexOf(o) % 4; }
    var xi = step.inputs.filter(function(i){ return i.id === step.chart.x; })[0];
    var ys = step.chart.y.map(function(id){ return step.outputs.filter(function(o){ return o.id === id; })[0]; }).filter(Boolean);
    var W = 320, H = 170, L = 40, R = 10, T = 10, B = 28;
    var lo = Math.min.apply(null, ys.map(function(o){ return o.lo; })), hi = Math.max.apply(null, ys.map(function(o){ return o.hi; }));
    if (lo > 0 && lo < hi * 0.5) lo = 0;
    if (!(hi > lo)) { hi = lo + 1; lo = lo - 1; }
    var pad = (hi - lo) * 0.06; lo -= (lo === 0 ? 0 : pad); hi += pad;
    function X(v){ return L + (v - xi.min) / (xi.max - xi.min) * (W - L - R); }
    function Y(v){ return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); }
    var s = svg('svg', {viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Chart of ' + ys.map(function(o){ return o.label; }).join(', ') + ' against ' + xi.label});
    s.appendChild(svg('line', {class:'axis', x1:L, y1:H - B, x2:W - R, y2:H - B}));
    s.appendChild(svg('line', {class:'axis', x1:L, y1:T, x2:L, y2:H - B}));
    s.appendChild(svg('text', {class:'tick', x:L, y:H - B + 14, 'text-anchor':'start', text: fmt(xi.min, decimals(xi.step))}));
    s.appendChild(svg('text', {class:'tick', x:W - R, y:H - B + 14, 'text-anchor':'end', text: fmt(xi.max, decimals(xi.step))}));
    s.appendChild(svg('text', {class:'tick', x:(L + W - R) / 2, y:H - 3, 'text-anchor':'middle', text: xi.label + (xi.unit ? ' (' + xi.unit + ')' : '')}));
    s.appendChild(svg('text', {class:'tick', x:L - 4, y:T + 8, 'text-anchor':'end', text: fmt(hi)}));
    s.appendChild(svg('text', {class:'tick', x:L - 4, y:H - B, 'text-anchor':'end', text: fmt(lo)}));
    var N = 80, env0 = {};
    for (var k in values) env0[k] = values[k];
    ys.forEach(function(o, c){
      var pts = [];
      for (var j = 0; j <= N; j++) {
        var xv = xi.min + (xi.max - xi.min) * j / N; env0[xi.id] = xv;
        var yv = compute(step, env0)[o.id];

    (function frame(){
      var t = Date.now() - t0; ctx.clearRect(0, 0, W, H);
      ps.forEach(function(q){ q.vy += .25; q.x += q.vx; q.y += q.vy; q.r += .2; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.globalAlpha = Math.max(0, 1 - t / 1800); ctx.fillRect(-q.s / 2, -q.s / 2, q.s, q.s * .6); ctx.restore(); });
      if (t < 1800) requestAnimationFrame(frame); else c.remove();
    })();
  }

  /* ================================ feedback ================================ */
  function token(){ return store.get('wm2:token', ''); }
  function audioUrl(ep){ return 'https://github.com/' + DATA.repo + '/releases/download/episodes/' + ep.file; }
  function feedbackOf(ep){
    var s = st(ep.file), d = deckFor(ep), out = {episode: ep.file, date: ep.date, edition: ep.edition};
    var quiz = null, puzzles = null, play = null;
    if (ep.quiz && ep.quiz.length && Object.keys(s.bonus.cards).length) {
      var n = 0, missed = [];
      ep.quiz.forEach(function(q, i){ var p = s.bonus.cards['q' + i]; if (!p || !p.done) return; if (p.ok) n++; else missed.push((q.segment ? q.segment + ': ' : '') + q.q); });
      quiz = {score: n, total: ep.quiz.length, missed: missed.slice(0, 6)};
    }
    if (d) {
      var stt = deckStats(d), struggled = [], segDone = 0;
      d.cards.forEach(function(c){
        var p = d.prog.cards[c.id];
        if (scoring(c) && p && p.done && p.ok === false) struggled.push((d.play.segments[c.seg] || {}).title + ': ' + String(c.r.q || c.r.text || (c.r.items && c.r.items[0] && (c.r.items[0].text || c.r.items[0])) || c.r.type).slice(0, 140));
        if (c.k === 'settle' && p && p.done) segDone++;
      });
      if (stt.done) {
        puzzles = {done: segDone, total: d.play.segments.length, struggled: struggled.slice(0, 8)};
        var bets = [];
        d.play.segments.forEach(function(sg, i){ var b = d.prog.bets[i]; if (sg.bet && b && b.pick !== undefined && (d.prog.cards['x' + i] || {}).done) bets.push({conf: b.conf, right: b.pick === sg.bet.truth}); });
        play = {cards: stt.n, done: stt.done, right: stt.right, points: stt.pts, bets: bets, formats: d.cards.filter(scoring).map(function(c){ return c.r.type; })};
      }
    }
    var segs = {}; Object.keys(s.segments).forEach(function(k){ if (s.segments[k]) segs[k] = s.segments[k]; });
    var r = {}; Object.keys(s.ratings).forEach(function(k){ if (s.ratings[k] !== undefined) r[k] = s.ratings[k]; });
    var comment = (s.comment || '').trim().slice(0, 1500);
    if (!quiz && !puzzles && !Object.keys(segs).length && !Object.keys(r).length && !comment) return null;
    out.quiz = quiz; out.puzzles = puzzles; out.play = play; out.ratings = r; out.segments = segs; out.comment = comment;
    return out;
  }
  function pending(explicit){
    // Feedback not sent yet. Sent on its own only once it says something about the SHOW (a rating, a reaction, a
    // comment) - a game score alone is not worth an issue. Pressing Send sends whatever there is.
    var out = [];
    (DATA ? DATA.episodes : []).forEach(function(ep){
      var f = feedbackOf(ep); if (!f) return;
      var said = Object.keys(f.ratings).length || Object.keys(f.segments).length || f.comment;
      if (!explicit && !said) return;
      var sig = JSON.stringify(f);
      if (PROFILE.sent[ep.file] !== hashStr(sig)) out.push({f: f, file: ep.file, sig: hashStr(sig)});
    });
    return out;
  }
  function issueFor(list){
    var fb = list.map(function(x){ return x.f; });
    var lines = fb.map(function(f){
      return '- ' + f.date + ' ' + f.edition + (f.play ? ' · game ' + f.play.points + ' pts, ' + f.play.done + '/' + f.play.cards + ' cards' : '') +
        (f.quiz ? ' · quiz ' + f.quiz.score + '/' + f.quiz.total : '') + (f.ratings.overall ? ' · ' + f.ratings.overall + '★' : '') +
        (f.comment ? ' · "' + f.comment.slice(0, 120) + '"' : '');
    });
    return {title: 'Feedback: ' + fb.map(function(f){ return f.date + ' ' + f.edition; }).join(', '),
            body: 'Feedback from the play page.\n\n' + lines.join('\n') + '\n\n```json\n' + JSON.stringify({feedback: fb}) + '\n```\n'};
  }
  function markSent(list){ list.forEach(function(x){ PROFILE.sent[x.file] = x.sig; }); saveProfile(); }
  function sendFeedback(explicit, cb){
    cb = cb || function(){};
    var list = pending(explicit);
    if (!list.length) { cb(true, explicit ? 'Nothing new to send - it is all in already.' : ''); return; }
    var iss = issueFor(list), tok = token();
    if (!tok) {
      if (!explicit) return;
      window.open('https://github.com/' + DATA.repo + '/issues/new?labels=feedback&title=' + encodeURIComponent(iss.title) + '&body=' + encodeURIComponent(iss.body), '_blank', 'noopener');
      markSent(list);
      cb(true, 'GitHub opened in a new tab - press “Create” there. (Set up one-tap sending under Settings to skip this step.)');
      return;
    }
    fetch('https://api.github.com/repos/' + DATA.repo + '/issues', {method: 'POST', keepalive: true,
      headers: {'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
      body: JSON.stringify({title: iss.title, body: iss.body, labels: ['feedback']})})
      .then(function(r){ if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'the token was refused (expired, or without Issues: write on this repository)' : 'GitHub answered ' + r.status); markSent(list); cb(true, 'Sent. The next episode will use it.'); })
      .catch(function(e){ cb(false, 'Not sent: ' + e.message + '. It is kept and will be tried again.'); });
  }
  function maybeSend(){ if (token()) sendFeedback(false); }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden' && DATA) maybeSend(); });

  /* ================================ home ================================ */
  function istNow(){ return new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Kolkata'})); }
  function statusRow(){
    var row = el('div', {class: 'status'}), now = istNow(), today = dayKey(now), mins = now.getHours() * 60 + now.getMinutes();
    var ready = DATA.ready || {morning: '09:00', evening: '18:00'};
    ['morning', 'evening'].forEach(function(ed){
      var ep = DATA.episodes.filter(function(e){ return e.date === today && e.edition === ed; })[0];
      var hm = (ready[ed] || '').split(':'), due = (+hm[0]) * 60 + (+hm[1] || 0), name = ed.charAt(0).toUpperCase() + ed.slice(1);
      if (ep) row.appendChild(el('span', {class: 'ok', text: name + ' ✓ ' + String(ep.published).slice(11, 16)}));
      else if (mins > due) row.appendChild(el('span', {class: 'late', text: name + ' edition is late (due ' + ready[ed] + ')'}));
      else row.appendChild(el('span', {text: name + ' by ' + ready[ed]}));
    });
    return row;
  }
  function hero(ep){
    var d = deckFor(ep), s = st(ep.file), play = d ? d.play : null, th = THEMES[(play || {}).theme] || THEMES.classic;
    var card = el('section', {class: 'card hero', 'data-theme': (play || {}).theme || 'classic'});
    if (!d) {
      card.appendChild(el('div', {class: 'kick', text: ep.label}));
      card.appendChild(el('h2', {text: ep.title}));
      card.appendChild(el('p', {class: 'brief', text: 'No game was made for this episode.'}));
      if (ep.quiz && ep.quiz.length) { var q = el('button', {class: 'btn', type: 'button', text: '⚡ Quick quiz (' + ep.quiz.length + ')'}); q.addEventListener('click', function(){ openStage(bonusDeck(ep)); }); card.appendChild(q); }
      return card;
    }
    var stt = deckStats(d), started = d.prog.at > 0 || stt.done > 0, betsIn = d.cards.some(function(c){ return c.k === 'bet'; }) && d.cards.filter(function(c){ return c.k === 'bet'; }).every(function(c){ return (d.prog.cards[c.id] || {}).done; });
    card.appendChild(el('div', {class: 'kick'}, [th.icon + ' ' + th.name]));
    card.appendChild(el('h2', {text: play.title || ep.title}));
    card.appendChild(el('p', {class: 'ep', text: ep.title + ' · ' + Math.floor((+ep.duration || 0) / 60) + ' min'}));
    if (play.brief) card.appendChild(el('p', {class: 'brief', text: play.brief}));
    var label = stt.finished ? 'Play again' : !started ? th.go : betsIn && stt.done === 0 ? 'Settle your bets' : 'Continue';
    var go = el('button', {class: 'btn', type: 'button', text: label});
    go.addEventListener('click', function(){
      if (stt.finished) { s.play = {at: 0, cards: {}, bets: {}}; save(ep.file); }
      openStage(deckFor(ep));
    });
    var nb = d.cards.filter(function(c){ return c.k === 'bet'; }).length;
    var meta = stt.finished ? stt.pts + ' points · ' + stt.right + '/' + stt.n + ' first-time right'
      : betsIn && stt.done === 0 ? 'Bets placed. Come back after listening.'
      : 'About ' + Math.max(2, Math.round((stt.n * 25 + nb * 12) / 60)) + ' min · ' + (nb ? nb + (nb === 1 ? ' bet, ' : ' bets, ') : '') + stt.n + ' cards';
    card.appendChild(el('div', {class: 'row'}, [go, el('span', {class: 'meta', text: meta})]));
    if (started && !stt.finished) card.appendChild(el('div', {class: 'meter'}, [el('span', {style: 'width:' + Math.round(100 * d.prog.at / (d.cards.length - 1)) + '%'})]));
    card.appendChild(el('p', {class: 'hint', style: 'margin:12px 0 0'}, [el('a', {href: audioUrl(ep), target: '_blank', rel: 'noopener', text: '▶ Listen'}),
      ep.transcript ? ' · ' : null, ep.transcript ? el('a', {href: ep.transcript, target: '_blank', rel: 'noopener', text: 'Transcript'}) : null]));
    return card;
  }
  function epRow(ep){
    var d = deckFor(ep), stt = d ? deckStats(d) : null, th = THEMES[d ? d.theme : 'classic'] || THEMES.classic;
    var b = el('button', {class: 'eprow', type: 'button'}, [el('span', {class: 'ic', text: th.icon}),
      el('span', {class: 'grow'}, [el('span', {class: 't', text: ep.title.replace(/^[^:]*:\s*/, '')}), el('span', {class: 's', text: ep.label})]),
      el('span', {class: 'pts' + (stt && stt.finished ? ' done' : ''), text: stt ? (stt.finished ? '✓ ' + stt.pts : stt.done ? stt.done + '/' + stt.n : 'Play') : ''})]);
    b.addEventListener('click', function(){ if (d) openStage(deckFor(ep)); else if (ep.quiz && ep.quiz.length) openStage(bonusDeck(ep)); });
    return b;
  }
  function heardCard(){
    var h = DATA.heard || {}, lines = h.lines || [];
    if (lines.length) {
      var c = el('section', {class: 'card heard'}, [el('div', {class: 'sec', style: 'margin-top:0', text: 'You said → we did'})]);
      lines.forEach(function(x){ c.appendChild(el('p', {class: 'pair'}, [el('span', {class: 'said', text: x.said + ' → '}), el('span', {class: 'did', text: x.did})])); });
      return c;
    }
    var days = h.last ? Math.round((new Date(dayKey()) - new Date(h.last)) / 864e5) : null;
    if (days !== null && days >= 4) return el('section', {class: 'card nudge', text: 'The show last heard from you ' + days + ' days ago. Stars and one tap per story at the end of a game are enough to steer it.'});
    return null;
  }
  function statsCard(){
    var c = el('section', {class: 'card'});
    c.appendChild(el('div', {class: 'sec', style: 'margin-top:0', text: 'Your last 7 days'}));
    var wk = el('div', {class: 'week'});
    for (var i = 6; i >= 0; i--) { var d = addDays(new Date(), -i); wk.appendChild(el('div', {}, [el('i', {class: PROFILE.days[dayKey(d)] !== undefined ? 'on' : ''}), 'SMTWTFS'.charAt(d.getDay())])); }
    c.appendChild(wk);
    var any = CONF.some(function(x){ return (PROFILE.calib[x.c] || [0, 0])[1] > 0; });
    c.appendChild(el('div', {class: 'sec', text: 'Calibration: when you say X%, how often are you right?'}));
    if (!any) c.appendChild(el('p', {class: 'hint', style: 'margin:0', text: 'Place a few bets and this fills in. Well calibrated means your 70% bets come true about 70% of the time.'}));
    else {
      var g = el('div', {class: 'calib'});
      CONF.forEach(function(x){
        var v = PROFILE.calib[x.c] || [0, 0], rate = v[1] ? v[0] / v[1] : 0;
        g.appendChild(el('span', {text: 'Said ' + x.c + '%'}));
        g.appendChild(el('div', {class: 'bar'}, [v[1] ? el('i', {style: 'width:' + (rate * 100) + '%'}) : null, el('b', {style: 'left:' + x.c + '%', title: 'where a perfectly calibrated bar would end'})]));
        g.appendChild(el('span', {class: 'n', text: v[1] ? Math.round(rate * 100) + '% of ' + v[1] : '–'}));
      });
      c.appendChild(g);
      c.appendChild(el('p', {class: 'hint', style: 'margin:8px 0 0', text: 'The line marks where each bar should end. Bars short of it: overconfident.'}));
    }
    return c;
  }
  function wordsCard(){
    var keys = Object.keys(PROFILE.words);
    if (!keys.length) return null;
    var dt = el('details', {class: 'fold card'}, [el('summary', {text: keys.length + ' words collected'})]), box = el('div');
    keys.sort(function(a, b){ return PROFILE.words[b].d < PROFILE.words[a].d ? -1 : 1; }).slice(0, 60).forEach(function(k){ box.appendChild(el('div', {class: 'word'}, [el('b', {text: k}), el('p', {text: PROFILE.words[k].m})])); });
    dt.appendChild(box);
    return dt;
  }
  function settingsCard(){
    var dt = el('details', {class: 'fold card'}, [el('summary', {text: 'Settings'})]), box = el('div');
    box.appendChild(el('p', {style: 'margin:0 0 4px;font-weight:600', text: 'One-tap feedback'}));
    box.appendChild(el('p', {class: 'hint', style: 'margin:0', text: 'Without this, sending feedback opens GitHub and you press “Create” there. With a token, it is sent from this page - and on its own when you finish a game. Make a fine-grained token on GitHub (Settings → Developer settings → Fine-grained tokens) for the repository ' + DATA.repo + ' only, with one permission: Issues → Read and write. It is stored only in this browser.'}));
    var inp = el('input', {type: 'password', placeholder: 'github_pat_…', autocomplete: 'off', 'aria-label': 'GitHub token'}); inp.value = token();
    var note = el('div', {class: 'sent'});
    var saveB = el('button', {class: 'btn small', type: 'button', text: 'Save token'});
    saveB.addEventListener('click', function(){ store.set('wm2:token', inp.value.trim()); note.className = 'sent ok'; note.textContent = inp.value.trim() ? 'Saved. Feedback now sends from this page.' : 'Removed. Feedback opens GitHub again.'; });
    box.appendChild(inp); box.appendChild(saveB); box.appendChild(note);
    var reset = el('button', {class: 'link', type: 'button', text: 'Reset my points, streak and progress'});
    reset.addEventListener('click', function(){
      if (!confirm('Erase points, streak, calibration, collected words and all game progress in this browser?')) return;
      try { Object.keys(localStorage).forEach(function(k){ if (k.indexOf('wm:') === 0 || k === 'wm2:profile') localStorage.removeItem(k); }); } catch(e){}
      location.reload();
    });
    box.appendChild(el('div', {style: 'margin-top:14px'}, [reset]));
    dt.appendChild(box);
    return dt;
  }
  function renderHome(){
    var list = document.getElementById('list'); list.innerHTML = '';
    var sk = streak(), played = PROFILE.days[dayKey()] !== undefined;
    var pills = document.getElementById('pills'); pills.innerHTML = '';
    pills.appendChild(el('span', {class: 'pill' + (played ? '' : ' cold'), title: played ? 'Played today' : 'Play today to keep the streak', text: '🔥 ' + sk}));
    pills.appendChild(el('span', {class: 'pill', title: 'All-time points', text: '★ ' + fmt(PROFILE.xp, 0)}));
    list.appendChild(statusRow());
    if (!DATA.episodes.length) { list.appendChild(el('p', {class: 'empty', text: 'No episodes yet.'})); return; }
    var h = heardCard(); if (h) list.appendChild(h);
    var today = DATA.episodes.slice(0, 2), rest = DATA.episodes.slice(2);
    today.forEach(function(ep){ list.appendChild(hero(ep)); });
    var due = PROFILE.review.filter(function(x){ return x.due <= dayKey(); }).length;
    if (due) {
      var rc = el('section', {class: 'card'}, [el('div', {class: 'sec', style: 'margin-top:0', text: 'Rematch'}),
        el('p', {style: 'margin:0 0 10px', text: due + (due === 1 ? ' card' : ' cards') + ' that got you earlier ' + (due === 1 ? 'is' : 'are') + ' back for another go.'})]);
      var rb = el('button', {class: 'btn small', type: 'button', text: '🔁 Take the rematch'}); rb.addEventListener('click', function(){ openStage(reviewDeck()); });
      rc.appendChild(rb); list.appendChild(rc);
    }
    if (rest.length) { list.appendChild(el('div', {class: 'sec', text: 'Earlier this week'})); rest.forEach(function(ep){ list.appendChild(epRow(ep)); }); }
    list.appendChild(el('div', {class: 'sec', text: 'You'}));
    list.appendChild(statsCard());
    var w = wordsCard(); if (w) list.appendChild(w);
    list.appendChild(settingsCard());
  }

  function start(d){
    DATA = d;
    DATA.episodes.sort(function(a, b){ return a.published < b.published ? 1 : -1; });
    document.getElementById('show').textContent = d.show || 'Weights & Measures';
    document.getElementById('sub').textContent = 'Three-minute games on each episode';
    document.getElementById('x').addEventListener('click', closeStage);
    document.getElementById('next').addEventListener('click', function(){ go(1); });
    document.getElementById('back').addEventListener('click', function(){ go(-1); });
    renderHome();
    var m = /[#&]play=([^&]+)/.exec(location.hash);   // quiz.html#play=<file> opens that episode's game
    if (m) { var ep = DATA.episodes.filter(function(e){ return e.file === decodeURIComponent(m[1]); })[0]; if (ep && deckFor(ep)) openStage(deckFor(ep)); }
    maybeSend();
  }
  if (window.WM_DATA) start(window.WM_DATA);   // a preview with the data built in
  else fetch('quiz.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(start).catch(function(){
    document.getElementById('list').innerHTML = '<p class="empty">Could not load quiz.json.</p>';
  });
})();
</script>
